# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: simplemobile_development

test:
  <<: *default
  database: simplemobile_test

# Keep all your existing production: section below...

production:
  primary:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["DATABASE_URL"] %>
    database: <%= ENV["DATABASE_URL"]&.sub(/\/[^\/]+$/, '/cache') || 'cache' %>
    migrations_paths: db/cache_migrate
  queue:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["DATABASE_URL"] %>
    database: <%= ENV["DATABASE_URL"]&.sub(/\/[^\/]+$/, '/queue') || 'queue' %>
    migrations_paths: db/queue_migrate
  cable:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["DATABASE_URL"] %>
    database: <%= ENV["DATABASE_URL"]&.sub(/\/[^\/]+$/, '/cable') || 'cable' %>
    migrations_paths: db/cable_migrate